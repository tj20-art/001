<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>模拟银行支付</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #eef2ff; margin: 0; }
    .card { max-width: 720px; margin: 56px auto; background: white; padding: 32px; border-radius: 18px; box-shadow: 0 18px 45px rgba(15,23,42,.12); }
    h1 { margin-top: 0; }
    .row { display: flex; justify-content: space-between; border-bottom: 1px solid #e5e7eb; padding: 14px 0; }
    .amount { font-size: 32px; color: #16a34a; font-weight: 700; }
    button { background: #2563eb; color: white; border: 0; border-radius: 10px; padding: 14px 28px; font-size: 16px; cursor: pointer; }
    .tips { margin-top: 18px; color: #64748b; font-size: 13px; }
    code { word-break: break-all; }
  </style>
</head>
<body>
  <div class="card">
    <h1>模拟银行收银台</h1>
    <div class="row"><span>商户号</span><strong>{{ params.merchant_id }}</strong></div>
    <div class="row"><span>订单号</span><strong>{{ params.order_no }}</strong></div>
    <div class="row"><span>支付金额</span><strong class="amount">¥{{ '%.2f' | format(amount_yuan) }}</strong></div>
    <div class="row"><span>签名原文</span><code>{{ sign_raw }}</code></div>

    <form method="post" action="/pay/process">
      {% for key, value in params.items() %}
        <input type="hidden" name="{{ key }}" value="{{ value }}">
      {% endfor %}
      <p class="tips">用户在银行页面确认支付；电商系统不会接触银行卡密码等敏感信息。</p>
      <button type="submit">确认支付</button>
    </form>
  </div>
</body>
</html>
